name: Data correction
description: Report an incorrect EPIC event field with source evidence.
title: "[Data correction] "
labels: ["data-quality"]
body:
  - type: input
    id: event_id
    attributes:
      label: EPIC event ID
      placeholder: evt_...
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Authoritative source URL
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Field, current value and proposed correction
      description: Do not paste full third-party articles.
    validations:
      required: true
