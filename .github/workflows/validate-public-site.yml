name: Validate Public Site

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-poster.txt

      - name: Install pinned validation and browser dependencies
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt -r requirements-poster.txt
          python -m playwright install --with-deps chromium

      - name: Rebuild retained public snapshot
        run: python tools/build_public_data.py --from-existing

      - name: Render poster and check desktop and mobile surfaces
        run: python tools/render_poster.py

      - name: Test normalizers and status semantics
        run: python -m unittest discover -s tests -v

      - name: Validate release artifacts
        run: python tools/validate_release.py

      - name: Scan public artifacts for sensitive markers
        shell: bash
        run: |
          if grep -RIE '(token=|MIHOMO=|/root/|/home/|lavm-|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' \
            README.md rss.xml BACKUP data index.html events; then
            echo "Sensitive marker found in public artifacts."
            exit 1
          fi
