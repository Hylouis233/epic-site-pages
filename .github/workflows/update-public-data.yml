name: Update Public Data

on:
  schedule:
    - cron: "21 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh public snapshot
        env:
          EPIC_PUBLIC_SOURCE_BASE_URL: ${{ secrets.EPIC_PUBLIC_SOURCE_BASE_URL }}
        run: python tools/build_public_data.py

      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet; then
            echo "No public data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html rss.xml
          git commit -m "Refresh public data snapshot"
          git push
